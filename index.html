<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>宝可梦规则速查</title>
<style>
  :root {
    --bg: #0e1320;
    --bg2: #131a2b;
    --card: #182031;
    --card2: #1c2539;
    --line: #2a3448;
    --text: #e8edf7;
    --muted: #8b97ae;
    --yes: #34d399;
    --no: #fb7185;
    --unknown: #fbbf24;
    --accent: #5b8def;
    --accent2: #7aa5ff;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(91,141,239,.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(122,165,255,.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 620px; margin: 0 auto; }

  h1 {
    font-size: 21px; margin: 0 0 6px; letter-spacing: .4px;
    animation: fadeUp .5s var(--ease) both;
  }
  .sub {
    color: var(--muted); font-size: 12.5px; margin-bottom: 20px;
    animation: fadeUp .5s var(--ease) .06s both;
  }

  .search { display: block; margin-bottom: 14px; animation: fadeUp .5s var(--ease) .1s both; }
  .input-shell {
    position: relative; border-radius: 14px;
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line);
    transition: border-color .25s var(--ease), box-shadow .25s var(--ease), transform .25s var(--ease);
  }
  .input-shell:focus-within {
    border-color: rgba(91,141,239,.85);
    box-shadow: 0 0 0 4px rgba(91,141,239,.14), 0 10px 30px -12px rgba(91,141,239,.5);
    transform: translateY(-1px);
  }
  input {
    width: 100%; padding: 15px 16px; border: none; border-radius: 14px;
    background: transparent; color: var(--text); font-size: 15.5px; outline: none;
  }
  input::placeholder { color: #66718a; }

  button {
    position: relative; overflow: hidden;
    width: 100%; margin-top: 10px; padding: 14px 18px;
    border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 15.5px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 10px 24px -10px rgba(91,141,239,.9);
    transition: transform .16s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  }
  button:hover { filter: brightness(1.05); box-shadow: 0 14px 30px -12px rgba(91,141,239,1); }
  button:active { transform: scale(.985); }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(255,255,255,.45);
    transform: scale(0); animation: ripple .6s ease-out forwards;
  }

  .chips-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 2px 2px 8px;
    animation: fadeUp .5s var(--ease) .14s both;
  }
  .chips-head span { font-size: 12px; color: var(--muted); letter-spacing: .3px; }
  .refresh {
    display: inline-flex; align-items: center; gap: 5px;
    width: auto; margin: 0; padding: 5px 10px;
    font-size: 12px; font-weight: 600; letter-spacing: 0;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: none; cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .refresh:hover { color: var(--accent2); border-color: rgba(91,141,239,.6); background: rgba(91,141,239,.08); filter: none; }
  .refresh:active { transform: scale(.96); }
  .refresh.spin svg { animation: spin .5s var(--ease); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .chip {
    padding: 9px 10px; border-radius: 999px; font-size: 12.5px; text-align: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: 0; transform: translateY(6px);
    animation: chipIn .45s var(--ease) forwards;
    transition: transform .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease);
  }
  .chip:hover, .chip:active {
    transform: translateY(-2px); color: #cfd9ee;
    border-color: rgba(91,141,239,.55); background: #1b2438;
  }

  .card {
    position: relative; width: 100%; overflow-wrap: anywhere;
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    margin-bottom: 12px;
    transform-origin: top center;
    animation: cardIn .34s var(--ease) both;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 16px; bottom: 16px;
    width: 3px; border-radius: 3px; background: var(--accent); opacity: .8;
  }
  .card.yes::before { background: var(--yes); }
  .card.no::before { background: var(--no); }
  .card.unknown::before { background: var(--unknown); }

  .badge {
    display: inline-block; padding: 4px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 800; margin-bottom: 12px;
    animation: pop .3s var(--ease) .08s both;
  }
  .yes .badge { background: rgba(52,211,153,.16); color: var(--yes); }
  .no .badge { background: rgba(251,113,133,.16); color: var(--no); }
  .unknown .badge { background: rgba(251,191,36,.16); color: var(--unknown); }
  .title { font-size: 17px; font-weight: 700; margin-bottom: 7px; }
  .body { font-size: 14px; line-height: 1.7; color: #c8d3e7; }
  .basis { margin-top: 12px; font-size: 12px; color: var(--muted); }

  .loading .sk {
    height: 12px; border-radius: 6px; margin-bottom: 10px;
    background: linear-gradient(90deg, #222c42 25%, #2c3852 37%, #222c42 63%);
    background-size: 400% 100%; animation: shimmer 1.2s ease-in-out infinite;
  }
  .loading .sk.s1 { width: 30%; }
  .loading .sk.s2 { width: 70%; }
  .loading .sk.s3 { width: 55%; }

  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 30px 0; }
  .foot { margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.8; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes chipIn { to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="wrap">
  <h1>宝可梦规则速查</h1>
  <div class="sub">普通精灵赛 · 禁神兽 · 禁重复 · 禁睡眠</div>

  <div class="search">
    <div class="input-shell">
      <input id="q" placeholder="输入宝可梦 / 招式 / 道具，如：波克基斯能不能用" autocomplete="off" enterkeyhint="search">
    </div>

  </div>

  <div class="chips-head">
    <span>试试这些</span>
    <button class="refresh" id="reshuffle" type="button">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"

  </div>
  <div class="chips" id="chips"></div>
  <div id="out"><div class="empty">输入问题后按回车</div></div>

  <div class="foot">
    以群文件《宝可梦比赛规则》为准。查不到请询问裁判，别自己猜。<br>
    收录 <span id="cnt">0</span> 条宝可梦 + 招式 / 道具 / 特殊机制。

</div>

  function norm(s) {
    return s.replace(/\s+/g, "").replace(/[，。！？、,.!?]/g, "").toLowerCase();
  }

  function stripForm(name) {
    let s = norm(name);
    let form = "";
    PREFIX.forEach(function (p) {
      if (s.startsWith(p) && s.length > p.length + 1) {
        form = p + form;
        s = s.slice(p.length);
      }
    });
    SUFFIX.forEach(function (x) {
      if (s.endsWith(x) && s.length > x.length + 1) {
        form = form + "·" + x;
        s = s.slice(0, s.length - x.length);
      }
    });
    return { base: s, form: form };
  }

  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }

  function findMon(name) {
    const s = norm(name);
    if (!s) return null;
    // 1) 正名/别名精确
    for (const d of DEX) {
      if (norm(d.n) === s) return d;
      for (const a of d.a) if (norm(a) === s) return d;
    }
    // 2) 包含关系（输入里含名字，或名字含输入）
    let best = null, bestLen = 0;
    for (const d of DEX) {
      const n = norm(d.n);
      if (s.includes(n) && n.length > bestLen) { best = d; bestLen = n.length; }
      for (const a of d.a) {
        const an = norm(a);
        if (s.includes(an) && an.length > bestLen) { best = d; bestLen = an.length; }
      }
    }
    if (best) return best;
    // 3) 编辑距离（短名不做模糊匹配，避免“月神”误中“月石”）
    if (s.length <= 2) return null;
    let bd = null, bdist = 99;
    for (const d of DEX) {
      const n = norm(d.n);
      if (Math.abs(n.length - s.length) > 2) continue;
      const dist = lev(s, n);
      if (dist < bdist) { bdist = dist; bd = d; }
    }
    if (bd && bdist <= Math.max(1, Math.floor(s.length / 4))) return bd;
    return null;
  }

      status: "unknown",
      title: "没有查到这只宝可梦",
      body: "可能是新宝可梦、叫法不同，或规则表未收录。请把名字发给裁判确认。",
      basis: "速查卡 · 拿不准就问裁判"
    };

    const info = CAT_INFO[mon.c];
    const extra = parts.form ? "（你问的是「" + parts.form.replace(/^·/, "") + "」形态）" : "";
    if (!info.usable) {
      return {
        status: "no",
        title: mon.n + "：不能使用",
        body: info.reason + "。" + extra,
        basis: "四、宝可梦限制"
      };
    }
    return {
      status: "yes",
      title: mon.n + "：可以使用",
      body: info.reason + "。" + extra,
      basis: "四、宝可梦限制"
    };
  }

  global.PokeRulesEngine = { answer: answer, DEX: DEX };

  if (typeof module !== "undefined" && module.exports) module.exports = global.PokeRulesEngine;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
  const engine = window.PokeRulesEngine;
  const out = document.getElementById("out");
  const input = document.getElementById("q");
  const btn = document.getElementById("go");
  document.getElementById("cnt").textContent = engine.DEX.length;

  const POOL = [
    "波克基斯能不能用", "老盖能不能用", "原始固拉多能用吗", "Mega 巨金怪能用吗",
    "催眠术能用吗", "睡觉能用吗", "王者之证能用吗", "太晶化能用吗", "轰鸣月能不能用",
    "叉字蝠能不能用", "赛富豪能不能用", "巨锻匠能不能用", "肥大能不能用", "哑铃能不能用",
    "剑狗能用吗", "玛夏多能用吗", "虚吾伊德能用吗", "铁斑叶能用吗", "波荡水能用吗",
    "接棒能用吗", "极巨化能用吗", "Z 招式能用吗", "影子分身能用吗", "一击必杀能用吗",
    "同种道具能带两个吗", "快龙能不能用", "班基拉斯能不能用", "多龙巴鲁托能不能用",
    "卡璞・鸣鸣能用吗", "蕾冠王能用吗", "苍响能用吗", "巨金怪能不能用", "忍蛙能不能用"
  ];
  const chips = document.getElementById("chips");

  function pick(n) {
    const pool = POOL.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, n);
  }

  function renderChips(animate) {
    chips.innerHTML = "";
    pick(8).forEach(function (s, i) {
      const b = document.createElement("div");
      b.className = "chip";
      b.textContent = s;
      b.style.animation = "none";
      b.onclick = function () { input.value = s; run(); };
      chips.appendChild(b);
      void b.offsetWidth;  // 触发重排，让动画能重放
      b.style.animation = "chipIn .45s var(--ease) " + (0.03 + i * 0.035) + "s both";
    });
  }

  renderChips(false);

  document.getElementById("reshuffle").addEventListener("click", function () {
    this.classList.remove("spin");
    void this.offsetWidth;
    this.classList.add("spin");
    renderChips(true);
    setTimeout(() => this.classList.remove("spin"), 520);
  });

  function render(r) {
    const cls = r.status === "yes" ? "yes" : r.status === "no" ? "no" : "unknown";
    const label = r.status === "yes" ? "可以用" : r.status === "no" ? "不能用" : "不确定";
    out.innerHTML =
      '<div class="card ' + cls + '">' +
        '<div class="badge">' + label + '</div>' +
        '<div class="title">' + r.title + '</div>' +
        '<div class="body">' + r.body + '</div>' +
        (r.basis ? '<div class="basis">依据：' + r.basis + '</div>' : '') +
      '</div>';
    const card = out.firstElementChild;
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function showLoading() {
    out.innerHTML =
      '<div class="card loading">' +
        '<div class="sk s1"></div><div class="sk s2"></div><div class="sk s3"></div>' +
      '</div>';
  }

  let timer = null;
  function run() {
    const q = input.value.trim();
    if (!q) { input.focus(); return; }
    showLoading();
    clearTimeout(timer);
    timer = setTimeout(function () { render(engine.answer(q)); }, 200);
  }

  btn.addEventListener("click", function (e) {
    const rect = btn.getBoundingClientRect();
    const span = document.createElement("span");
    const size = Math.max(rect.width, rect.height) * 1.2;
    span.className = "ripple";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - rect.left - size / 2) + "px";
    span.style.top = (e.clientY - rect.top - size / 2) + "px";
    btn.appendChild(span);
    setTimeout(function () { span.remove(); }, 620);
    run();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); run(); }
  });

  window.addEventListener("load", function () {
    input.focus({ preventScroll: true });
    if (location.hash) {
      try { input.value = decodeURIComponent(location.hash.slice(1)); run(); } catch (err) {}
    }
  });
</script>
</body>
</html>
