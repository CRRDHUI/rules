<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>宝可梦规则速查</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #182031;
    --line: #2a3448;
    --text: #e6ebf5;
    --muted: #8a96ad;
    --yes: #2ecc71;
    --no: #ff5c5c;
    --unknown: #f0b429;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px 14px 40px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
  }
  html, body { overflow-x: hidden; }
  .wrap { width: 100%; max-width: 620px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  .search { display: block; margin-bottom: 14px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 8px; padding: 12px 18px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 18px; }
  .chip {
    padding: 7px 10px; border-radius: 999px; font-size: 12px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    cursor: pointer;
  }
  .chip:active { background: #202a3f; }
  .card { width: 100%; overflow-wrap: anywhere;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
    animation: in .18s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; margin-bottom: 10px;
  }
  .yes .badge { background: rgba(46,204,113,.15); color: var(--yes); }
  .no .badge { background: rgba(255,92,92,.15); color: var(--no); }
  .unknown .badge { background: rgba(240,180,41,.15); color: var(--unknown); }
  .title { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; }
  .body { font-size: 14px; line-height: 1.65; color: #c9d3e6; }
  .basis { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .foot { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 26px 0; }
</style>
</head>

  <h1>宝可梦规则速查</h1>

  function norm(s) {
    return s.replace(/\s+/g, "").replace(/[，。！？、,.!?]/g, "").toLowerCase();
  }

  function stripForm(name) {
    let s = norm(name);
    let form = "";
    PREFIX.forEach(function (p) {
      if (s.startsWith(p) && s.length > p.length + 1) {
        form = p + form;
        s = s.slice(p.length);
      }
    });
    SUFFIX.forEach(function (x) {
      if (s.endsWith(x) && s.length > x.length + 1) {
        form = form + "·" + x;
        s = s.slice(0, s.length - x.length);
      }
    });
    return { base: s, form: form };
  }

  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }

  function findMon(name) {
    const s = norm(name);
    if (!s) return null;

    for (const d of DEX) {
      if (norm(d.n) === s) return d;
      for (const a of d.a) if (norm(a) === s) return d;
    }
    // 2) 包含关系（输入里含名字，或名字含输入）
    let best = null, bestLen = 0;
    for (const d of DEX) {
      const n = norm(d.n);
      if (s.includes(n) && n.length > bestLen) { best = d; bestLen = n.length; }
      for (const a of d.a) {
        const an = norm(a);
        if (s.includes(an) && an.length > bestLen) { best = d; bestLen = an.length; }
      }
    }
    if (best) return best;
    // 3) 编辑距离
    let bd = null, bdist = 99;
    for (const d of DEX) {
      const n = norm(d.n);
      if (Math.abs(n.length - s.length) > 2) continue;
      const dist = lev(s, n);
      if (dist < bdist) { bdist = dist; bd = d; }
    }
    if (bd && bdist <= Math.max(1, Math.floor(s.length / 4))) return bd;
    return null;
  }

    }
    for (const m of MECHANICS) {
      if (m.k.some(function (k) { return s.includes(norm(k)); })) {
        if (m.usable && m.name.indexOf("Mega") === 0) {
          const cleaned2 = raw.replace(/mega|超级进化|mega进化/gi, "");

              status: mi.usable ? "yes" : "no",
              title: mb.n + (mi.usable ? "：可以使用" : "：不能使用"),
              body: mi.reason + "。本服所有宝可梦均可 Mega；每方每场最多 1 只。",
              basis: "四、宝可梦限制 / 七、特殊机制"
            };
          }
        }
        return {
          status: m.usable ? "yes" : "no",
          title: m.name + "：" + (m.usable ? "允许" : "禁止"),
          body: m.reason,
          basis: m.basis
        };
      }
    }

    // 招式
    for (const mv in BANNED_MOVES) {
      if (s.includes(norm(mv))) {
        return {
          status: "no",
          title: mv + "：禁止使用",
          body: "该招式属于「" + BANNED_MOVES[mv] + "」，本赛禁用。",
          basis: "五、招式与状态限制"
        };
      }
    }
    for (const mv in OK_MOVES) {
      if (s.includes(norm(mv))) {
        return {
          status: "yes",
          title: mv + "：可以使用",
          body: OK_MOVES[mv] + "。",
          basis: "五、招式与状态限制"
        };
      }
    }

    // 道具
    for (const it in ITEMS) {
      if (s.includes(norm(it))) {
        return {
          status: "no",
          title: it + "：禁用",
          body: ITEMS[it] + "。",
          basis: "六、道具限制"
        };
      }
    }

    // 宝可梦
    const cleaned = s
      .replace(/(能不能|可不可以|可以不|可以|能用|可用|能带|可以带|带回|使用|用|吗|呢|能|行不行|行|么|啊|呀|请问|问一下|这个|这只|精灵|宝可梦)/g, "")
      .replace(/[?？!！。]/g, "");
    const parts = stripForm(cleaned);
    let mon = findMon(parts.base) || findMon(cleaned);
    if (!mon) return {
      status: "unknown",
      title: "没有查到这只宝可梦",
      body: "可能是新宝可梦、叫法不同，或规则表未收录。请把名字发给裁判确认。",
      basis: "速查卡 · 拿不准就问裁判"
    };

    const info = CAT_INFO[mon.c];
    const extra = parts.form ? "（你问的是「" + parts.form.replace(/^·/, "") + "」形态）" : "";
    if (!info.usable) {
      return {
        status: "no",
        title: mon.n + "：不能使用",
        body: info.reason + "。" + extra,
        basis: "四、宝可梦限制"
      };
    }
    return {
      status: "yes",
      title: mon.n + "：可以使用",
      body: info.reason + "。" + extra,
      basis: "四、宝可梦限制"
    };
  }

  global.PokeRulesEngine = { answer: answer, DEX: DEX };

  if (typeof module !== "undefined" && module.exports) module.exports = global.PokeRulesEngine;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
  const engine = window.PokeRulesEngine;
  const out = document.getElementById("out");
  const input = document.getElementById("q");

  document.getElementById("cnt").textContent = engine.DEX.length;

  const samples = ["波克基斯能不能用", "老盖能不能用", "原始固拉多能用吗", "Mega 巨金怪能用吗",
                   "催眠术能用吗", "睡觉能用吗", "王者之证能用吗", "太晶化能用吗", "轰鸣月能不能用"];
  const chips = document.getElementById("chips");
  samples.forEach(function (s) {
    const b = document.createElement("div");
    b.className = "chip";
    b.textContent = s;
    b.onclick = function () { input.value = s; run(); };
    chips.appendChild(b);
  });

  function render(r) {
    const cls = r.status === "yes" ? "yes" : r.status === "no" ? "no" : "unknown";
    const label = r.status === "yes" ? "可以用" : r.status === "no" ? "不能用" : "不确定";
    out.innerHTML =
      '<div class="card ' + cls + '">' +
        '<div class="badge">' + label + '</div>' +
        '<div class="title">' + r.title + '</div>' +
        '<div class="body">' + r.body + '</div>' +
        (r.basis ? '<div class="basis">依据：' + r.basis + '</div>' : '') +
      '</div>';
  }

  function run() {
    const q = input.value.trim();
    if (!q) return;
    render(engine.answer(q));
  }

  document.getElementById("go").onclick = run;
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  input.focus();
  if (location.hash) {
    try { input.value = decodeURIComponent(location.hash.slice(1)); run(); } catch (e) {}
  }
</script>
</body>
</html>
